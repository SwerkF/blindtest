server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /ws {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://server:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Invite links: link previews (Discord, WhatsApp...) don't run JS, so swap the share card here
    location ~ ^/join/(?<invite>[A-Za-z0-9]+)/?$ {
        sub_filter_once off;
        sub_filter '/og-image.png' '/og-invite.png';
        sub_filter 'content="https://blindtest.oliwr.win/"' 'content="https://blindtest.oliwr.win/join/$invite"';
        sub_filter 'Blindtest · Blind test musical entre amis' 'Tu es invité à un blindtest ! · Partie $invite';
        sub_filter 'Crée un salon, invite tes amis et devine' 'Rejoins la partie $invite et devine';
        sub_filter 'content="Blindtest : devine' 'content="Invitation à une partie de Blindtest : devine';
        try_files /index.html =404;
    }

    # Public profiles: the preview shows a per-player card rendered by the server
    # (GET /og/user/:id.png). nginx cannot know the pseudo, so the title stays
    # generic; the card itself carries the name and the stats.
    location ~ ^/u/(?<uid>[A-Za-z0-9_-]+)/?$ {
        sub_filter_once off;
        sub_filter 'https://blindtest.oliwr.win/og-image.png' 'https://blindtest.oliwr.win/api/og/user/$uid.png';
        sub_filter 'content="https://blindtest.oliwr.win/"' 'content="https://blindtest.oliwr.win/u/$uid"';
        sub_filter 'Blindtest · Blind test musical entre amis' 'Profil de joueur · Blindtest';
        sub_filter 'Crée un salon, invite tes amis et devine' 'Parties, victoires et succès de ce joueur. Crée un salon, invite tes amis et devine';
        sub_filter 'content="Blindtest : devine' 'content="Carte de profil Blindtest : devine';
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
