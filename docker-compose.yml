services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    expose:
      - "3001"
    # Optional: DATABASE_URL is set below, the files only add local overrides.
    # The root .env carries the Discord login settings, see .env.example.
    env_file:
      - path: .env
        required: false
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: "file:/data/dev.db"
      # Only for a deploy whose schema change `prisma db push` flags as lossy, see apps/server/Dockerfile
      PRISMA_ACCEPT_DATA_LOSS: "${PRISMA_ACCEPT_DATA_LOSS:-}"
    volumes:
      - db-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
