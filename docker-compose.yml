services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    expose:
      - "3001"
    env_file:
      - apps/server/.env
    environment:
      DATABASE_URL: "file:/data/dev.db"
    volumes:
      - db-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
